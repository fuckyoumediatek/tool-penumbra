name: Build and Release Penumbra (Windows)

on:
  push:
    tags:
      - 'v*' # Se ejecuta al subir un tag (ej: v1.0.0) a TU repositorio
  workflow_dispatch: # Permite ejecutar el botón manual

permissions:
  contents: write # Permiso para crear la release en TU repositorio

jobs:
  build-and-release:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      # 1. Clona explícitamente el repositorio original de shomykohai
      - name: Clone shomykohai/penumbra
        uses: actions/checkout@v4
        with:
          repository: 'shomykohai/penumbra'
          # ref: 'main' # Descomenta y cambia esto si quieres compilar una rama o tag específico de su repo

      # 2. Instala Rust para Windows
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 3. Cachea dependencias para acelerar futuras compilaciones
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # 4. Compila el proyecto completo en modo release
      - name: Build Project
        run: cargo build --release

      # 5. Busca y prepara los ejecutables (antumbra.exe, tui.exe, penumbra.exe)
      - name: Prepare executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_files
          
          if (Test-Path "target\release\antumbra.exe") {
              Copy-Item "target\release\antumbra.exe" -Destination "release_files\"
              Write-Host "antumbra.exe copiado."
          }
          if (Test-Path "target\release\tui.exe") {
              Copy-Item "target\release\tui.exe" -Destination "release_files\"
              Write-Host "tui.exe copiado."
          }
          if (Test-Path "target\release\penumbra.exe") {
              Copy-Item "target\release\penumbra.exe" -Destination "release_files\"
              Write-Host "penumbra.exe copiado."
          }

      # 6. Crea la release en tu GitHub y sube los .exe compilados
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Solo crea la release si ejecutaste subiendo un tag
        with:
          files: release_files/*.exe
          generate_release_notes: true
