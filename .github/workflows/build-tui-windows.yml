name: Build and Release Penumbra TUI (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build exactly the TUI folder
    runs-on: windows-latest

    steps:
      - name: Checkout fuckyoumediatek/tool-penumbra
        uses: actions/checkout@v4
        with:
          repository: 'fuckyoumediatek/tool-penumbra'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # AQUÍ ESTÁ LA MAGIA: Le decimos que compile SOLO el Cargo.toml de la carpeta tui
      - name: Build TUI folder specifically
        run: cargo build --release --manifest-path tui/Cargo.toml

      - name: Prepare executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_files
          
          # Busca cualquier .exe en cualquier carpeta "target\release" del repositorio y lo copia
          Get-ChildItem -Path . -Filter *.exe -Recurse | Where-Object { $_.FullName -match "target\\release" } | Copy-Item -Destination release_files\
          
          Write-Host "Ejecutables encontrados y copiados:"
          Get-ChildItem -Path release_files\ | Select-Object Name

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: Ejecutables Compilados (Build ${{ github.run_id }})
          files: release_files/*.exe
